<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Subashini Training Academy 🚀</h1>
    <h3>Freshers Guide | Training & Tech</h3>
    <p>Empowering young developers through quality training 👨🏻‍💻</p>

    <hr>

    <h2>Registration Form</h2>

    <form>
        <table class="form-table">
            <tr>
                <td>Name</td>
                <td><input type="text" placeholder="Enter your name" required></td>
            </tr>
            <tr>
                <td>Age</td>
                <td><input type="number" placeholder="Enter your age" required></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" required> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" placeholder="Enter your email" required></td>
            </tr>
            <tr>
                <td>Course</td>
                <td>
                    <select required>
                        <option value="">-- Select --</option>
                        <option>Full Stack Development</option>
                        <option>SQL</option>
                        <option>Python</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Upload Resume</td>
                <td><input type="file" required></td>
            </tr>
            <tr>
                <td colspan="2" class="buttons">
                    <input type="reset" class="form-btn">
                    <input type="submit" class="form-btn">
                </td>
            </tr>
        </table>
    </form>

    <hr>
    <a href="index.html" class="btn">Home</a>

</div>

</body>
</html>
